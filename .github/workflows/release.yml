name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
            args: --win --x64
            updater_metadata: true
          - runner: windows-11-arm
            target: win-arm64
            args: --win --arm64
            updater_metadata: false
          - runner: macos-15-intel
            target: mac-x64
            args: --mac --x64
            updater_metadata: false
          - runner: macos-latest
            target: mac-arm64
            args: --mac --arm64
            updater_metadata: false
          - runner: ubuntu-latest
            target: linux-x64
            args: --linux --x64
            updater_metadata: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            args: --linux --arm64
            updater_metadata: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Package ${{ matrix.target }}
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: MQTTape-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload x64 update metadata
        if: matrix.updater_metadata
        uses: actions/upload-artifact@v7
        with:
          name: MQTTape-${{ matrix.target }}-update-metadata
          path: |
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: MQTTape-*
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            MQTTape releases include the latest inspected source, cross-platform
            desktop packages, and a SHA-256 checksum manifest.

            Installed Windows x64 builds and supported Linux x64 packages can
            download future updates in the background. ARM64 packages, the
            Windows portable build, and unsigned macOS builds continue to use
            manual downloads.

            ## Code signing policy

            Free code signing provided by [SignPath.io](https://about.signpath.io/),
            certificate by [SignPath Foundation](https://signpath.org/).
            See the [project policy](https://github.com/NickYCLin/MQTTape#code-signing-policy)
            for signing roles and privacy details. Windows packages published
            before enrollment and signing-workflow activation remain unsigned.
            macOS packages are currently unsigned.
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MQTTape $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --verify-tag
