name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win
            args: --win --x64
          - runner: macos-latest
            target: mac
            args: --mac --x64 --arm64
          - runner: ubuntu-latest
            target: linux
            args: --linux --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Package ${{ matrix.target }}
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: MQTTape-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            MQTTape releases include the latest inspected source, cross-platform
            desktop packages, and a SHA-256 checksum manifest.

            Installed Windows builds and supported Linux packages can download
            future updates in the background. The Windows portable build and
            unsigned macOS builds continue to use manual downloads.

            Windows and macOS packages are unsigned. Review the repository and
            checksum file before bypassing SmartScreen or Gatekeeper warnings.
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MQTTape $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --verify-tag
