name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win
            args: --win --x64
          - runner: macos-latest
            target: mac
            args: --mac --x64 --arm64
          - runner: ubuntu-latest
            target: linux
            args: --linux --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Package ${{ matrix.target }}
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: MQTTape-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            MQTTape v0.2 adds safer replay controls, encrypted broker profiles,
            desktop mTLS file selection, and a deployable Web Lite client.

            Windows and macOS packages are unsigned. Review the repository and
            checksum file before bypassing SmartScreen or Gatekeeper warnings.
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MQTTape $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --verify-tag
