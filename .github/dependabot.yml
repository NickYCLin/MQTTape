version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep breaking major upgrades isolated so peer compatibility can be
      # reviewed independently instead of blocking every dev dependency update.
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - '*'
